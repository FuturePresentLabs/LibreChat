name: FPL LibreChat Image

on:
  push:
    branches:
      - fpl/prod-librechat
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/futurepresentlabs/librechat
  FPL_IMAGE: librechat

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.IMAGE }}:fpl-prod
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=fpl-librechat
          cache-to: type=gha,mode=max,scope=fpl-librechat

      - name: Install registry client certs
        run: .github/scripts/install-fpl-registry-certs.sh
        env:
          FPL_REGISTRY_DIRECT_HOST: ${{ vars.FPL_REGISTRY_DIRECT_HOST || 'registry-direct.fpl.dev' }}
          FPL_REGISTRY_CA_CERT: ${{ secrets.FPL_REGISTRY_CA_CERT }}
          FPL_REGISTRY_CLIENT_CERT: ${{ secrets.FPL_REGISTRY_CLIENT_CERT }}
          FPL_REGISTRY_CLIENT_KEY: ${{ secrets.FPL_REGISTRY_CLIENT_KEY }}

      - name: Build FPL registry tags
        run: |
          docker build \
            --build-arg "BUILD_COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_BRANCH=${GITHUB_REF_NAME}" \
            --build-arg "BUILD_DATE=${{ github.event.head_commit.timestamp }}" \
            -t "${FPL_REGISTRY_DIRECT_HOST}/${FPL_IMAGE}:fpl-prod" \
            -t "${FPL_REGISTRY_DIRECT_HOST}/${FPL_IMAGE}:sha-${GITHUB_SHA}" \
            -f Dockerfile \
            .
        env:
          FPL_REGISTRY_DIRECT_HOST: ${{ vars.FPL_REGISTRY_DIRECT_HOST || 'registry-direct.fpl.dev' }}

      - name: Push FPL registry image
        run: |
          docker push "${FPL_REGISTRY_DIRECT_HOST}/${FPL_IMAGE}:fpl-prod"
          docker push "${FPL_REGISTRY_DIRECT_HOST}/${FPL_IMAGE}:sha-${GITHUB_SHA}"
          docker manifest inspect "${FPL_REGISTRY_DIRECT_HOST}/${FPL_IMAGE}:fpl-prod" >/dev/null
        env:
          FPL_REGISTRY_DIRECT_HOST: ${{ vars.FPL_REGISTRY_DIRECT_HOST || 'registry-direct.fpl.dev' }}
