name: FPL LibreChat Image

on:
  push:
    branches:
      - fpl/prod-librechat
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: registry.fpl.dev/librechat

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to FPL registry
        uses: docker/login-action@v4
        with:
          registry: registry.fpl.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.IMAGE }}:fpl-prod
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=fpl-librechat
          cache-to: type=gha,mode=max,scope=fpl-librechat
